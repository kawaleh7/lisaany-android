name: 2) Build Android (.aab for Play Store)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'capacitor.config.json'
      - 'package.json'
      - '*.png'
      - '*.woff2'
      - 'lisaany-fonts.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Arrange folders
        run: |
          mkdir -p www/icons resources
          cp index.html manifest.json www/
          if [ -f lisaany-fonts.zip ]; then unzip -o -q lisaany-fonts.zip -d www/; fi
          if ls *.woff2 >/dev/null 2>&1; then cp *.woff2 www/; fi
          cp icon-192.png icon-512.png maskable-512.png www/icons/
          cp icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png resources/
          ls www
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Set version + app name
        run: |
          sed -i "s/minSdkVersion = 2[0-9]/minSdkVersion = 23/" android/variables.gradle
          VER_CODE=${{ github.run_number }}
          VER_NAME="1.0.${{ github.run_number }}"
          sed -i "s/versionCode [0-9]*/versionCode $VER_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER_NAME\"/" android/app/build.gradle
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Lisaany</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">Lisaany</string>|' android/app/src/main/res/values/strings.xml
      - name: Build release bundle
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Sign bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the 3 GitHub secrets first"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > upload.keystore
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore upload.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
          VER_NAME="1.0.${{ github.run_number }}"
          mkdir -p out && cp "$AAB" "out/lisaany-$VER_NAME.aab"
          jarsigner -verify out/*.aab && echo "Signed OK"
      - name: Upload .aab
        uses: actions/upload-artifact@v4
        with:
          name: lisaany-android-aab
          path: out/*.aab
