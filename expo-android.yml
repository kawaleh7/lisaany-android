# Builds the new Expo (React Native) Lisaany app into a signed .aab for Google Play.
#
# How to use: upload the project zip (lisaany-app.zip) to the top of this repo.
# That upload starts this workflow. When it finishes (about 20-30 minutes),
# open the run and download the "lisaany-aab" artifact, then upload the .aab
# inside it to Play Console > Testing > Internal testing.
#
# Signing reuses the secrets that signed the old app (KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS; key password = keystore password, as
# workflow 1 created it), so Google accepts it as an update.
# The version code is 1000 + this workflow's run number. The old Capacitor
# builds used plain run numbers (v1.0.11 = code 11), so this is always higher.

name: Expo app - signed AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'lisaany-app*.zip'
      - '.github/workflows/expo-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: build/lisaany-app

    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project zip
        working-directory: .
        run: |
          ZIP=$(ls lisaany-app*.zip 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIP" ]; then echo "::error::No lisaany-app*.zip at the top of the repo"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p build
          unzip -q "$ZIP" -d build
          if [ ! -f build/lisaany-app/package.json ]; then echo "::error::The zip must contain a lisaany-app folder with package.json"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 36 and NDK
        working-directory: .
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" > /dev/null
          echo "SDK ready"

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Set version
        run: |
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.android.versionCode=$CODE;fs.writeFileSync('app.json',JSON.stringify(j,null,2));console.log('version',j.expo.version,'code',$CODE)"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Add the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          // Added by the workflow: sign release builds with the Play upload key.
          android {
              signingConfigs {
                  upload {
                      storeFile file('upload.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.upload
                  }
              }
          }
          GRADLE
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties

      - name: Build the app bundle
        working-directory: build/lisaany-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NODE_ENV: production
        run: ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Show the signing certificate
        working-directory: build/lisaany-app/android/app/build/outputs/bundle/release
        run: |
          ls -la
          keytool -printcert -jarfile app-release.aab | grep -E "Owner|SHA256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: lisaany-aab
          path: build/lisaany-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
